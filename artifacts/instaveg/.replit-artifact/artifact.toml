kind = "web"
previewPath = "/"
title = "InstaVEG"
version = "1.0.0"
id = "artifacts/instaveg"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22039

[services.development]
run = "pnpm --filter @workspace/instaveg run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/instaveg", "run", "build" ]
publicDir = "artifacts/instaveg/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22039"
BASE_PATH = "/"
